<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnero — Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── CONFIG ─────────────────────────────────────────── */
    :root {
      --accent: #ff7f50;
      --accent-dim: rgba(255,127,80,0.12);
      --bg: #0f0f10;
      --surface: #1a1917;
      --border: rgba(255,255,255,0.08);
      --text: #f4efe7;
      --muted: #9a9490;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "DM Sans", sans-serif;
      background: radial-gradient(circle at top, rgba(255,149,43,0.08), transparent 22%),
                  linear-gradient(180deg, #0f0f10 0%, #171514 48%, #0b0b0c 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 48px;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      max-width: 560px;
      margin: 0 auto;
    }

    /* header */
    .app-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .app-eyebrow {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .app-title {
      font-size: 26px;
      font-weight: 600;
      line-height: 1.2;
    }
    .app-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 6px;
    }

    /* stepper */
    .stepper {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .step-dot {
      width: 28px; height: 4px;
      border-radius: 2px;
      background: var(--border);
      transition: background 0.3s;
    }
    .step-dot.active { background: var(--accent); }
    .step-dot.done { background: rgba(255,127,80,0.4); }

    /* card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .step-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .step-question {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    /* options grid */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .option-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.2s;
    }
    .option-btn:hover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .option-btn.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .option-btn strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .option-btn span {
      font-size: 12px;
      color: var(--muted);
    }

    /* day strip */
    .day-strip {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .day-strip::-webkit-scrollbar { display: none; }
    .day-btn {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: border-color 0.2s, background 0.2s;
      min-width: 58px;
    }
    .day-btn.selected {
      border-color: var(--accent);
      background: var(--accent-dim);
    }
    .day-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .day-btn strong { display: block; font-size: 15px; font-weight: 600; }
    .day-btn span { font-size: 11px; color: var(--muted); }

    /* time grid */
    .time-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .time-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s;
    }
    .time-btn:hover { border-color: var(--accent); background: var(--accent-dim); }
    .time-btn.selected { border-color: var(--accent); background: var(--accent-dim); }
    .time-btn.taken { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }

    /* form fields */
    .field-group { display: flex; flex-direction: column; gap: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: var(--muted); }

    /* summary box */
    .summary-box {
      background: var(--accent-dim);
      border: 1px solid rgba(255,127,80,0.25);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.7;
    }
    .summary-box strong { color: var(--accent); }

    /* buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 22px;
    }
    .btn {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      flex: 1;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--accent);
      color: #0f0f10;
    }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-wa {
      background: #25d366;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* confirm view */
    .confirm-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid rgba(255,127,80,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    .confirm-icon svg { width: 26px; height: 26px; color: var(--accent); }

    /* footer badge */
    .footer-badge {
      text-align: center;
      margin-top: 28px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
    .footer-badge a { color: var(--accent); text-decoration: none; }

    @media (max-width: 400px) {
      .options-grid { grid-template-columns: 1fr; }
      .time-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
<div class="shell">

  <header class="app-header">
    <p class="app-eyebrow">Reservas online</p>
    <h1 class="app-title" id="biz-name">Peluquería Roma</h1>
    <p class="app-sub">Elegí servicio, día y horario</p>
  </header>

  <div class="stepper">
    <div class="step-dot active" id="dot-0"></div>
    <div class="step-dot" id="dot-1"></div>
    <div class="step-dot" id="dot-2"></div>
    <div class="step-dot" id="dot-3"></div>
  </div>

  <div class="card" id="app-card"></div>

  <p class="footer-badge">Hecho por <a href="https://devstudio-chi.vercel.app" target="_blank">DevStudio</a></p>
</div>

<script>
// ── CONFIGURACIÓN ──────────────────────────────────────────────
const CONFIG = {
  negocio: "Peluquería Roma",
  whatsapp: "5492235954195",
  servicios: [
    { nombre: "Corte de pelo", duracion: 30, precio: "$3.500" },
    { nombre: "Corte + barba", duracion: 45, precio: "$5.500" },
    { nombre: "Afeitado clásico", duracion: 30, precio: "$3.000" },
    { nombre: "Coloración", duracion: 90, precio: "$8.000" },
  ],
  diasHabiles: [1, 2, 3, 4, 5, 6], // 0=dom, 1=lun ... 6=sáb
  horarios: { inicio: 9, fin: 19 },  // horas (24h)
  intervaloMinutos: 30,
  // turnos ya ocupados (demo): "YYYY-MM-DD HH:MM"
  ocupados: ["2026-05-21 10:00", "2026-05-21 10:30", "2026-05-22 14:00"],
};

// ── STATE ───────────────────────────────────────────────────────
let state = { step: 0, servicio: null, dia: null, hora: null, nombre: "", tel: "" };

// ── UTILS ───────────────────────────────────────────────────────
const dias = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
const meses = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];

function pad(n) { return String(n).padStart(2, "0"); }

function nextDays(n = 14) {
  const result = [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (let i = 1; i <= n + 7; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    if (CONFIG.diasHabiles.includes(d.getDay())) {
      result.push(d);
      if (result.length === n) break;
    }
  }
  return result;
}

function timeSlots(date) {
  const slots = [];
  const { inicio, fin, intervaloMinutos } = CONFIG.horarios;
  for (let h = inicio * 60; h < fin * 60; h += intervaloMinutos) {
    const hh = Math.floor(h / 60);
    const mm = h % 60;
    const label = `${pad(hh)}:${pad(mm)}`;
    const key = `${fmtDate(date)} ${label}`;
    slots.push({ label, taken: CONFIG.ocupados.includes(key) });
  }
  return slots;
}

function fmtDate(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function fmtDateHuman(d) {
  return `${dias[d.getDay()]} ${d.getDate()} de ${meses[d.getMonth()]}`;
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`dot-${i}`);
    el.className = "step-dot" + (i < state.step ? " done" : i === state.step ? " active" : "");
  }
}

// ── RENDER STEPS ────────────────────────────────────────────────
function render() {
  updateDots();
  const card = document.getElementById("app-card");
  document.getElementById("biz-name").textContent = CONFIG.negocio;
  if (state.step === 0) renderServicios(card);
  else if (state.step === 1) renderDias(card);
  else if (state.step === 2) renderHorarios(card);
  else if (state.step === 3) renderDatos(card);
  else renderConfirm(card);
}

function renderServicios(card) {
  card.innerHTML = `
    <p class="step-label">Paso 1 de 4</p>
    <p class="step-question">¿Qué servicio necesitás?</p>
    <div class="options-grid">
      ${CONFIG.servicios.map((s, i) => `
        <button class="option-btn ${state.servicio === i ? 'selected' : ''}" data-i="${i}">
          <strong>${s.nombre}</strong>
          <span>${s.duracion} min · ${s.precio}</span>
        </button>
      `).join("")}
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="btn-next" ${state.servicio === null ? "disabled" : ""}>Siguiente</button>
    </div>
  `;
  card.querySelectorAll(".option-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.servicio = parseInt(btn.dataset.i);
      render();
    });
  });
  card.querySelector("#btn-next")?.addEventListener("click", () => { state.step = 1; render(); });
}

function renderDias(card) {
  const days = nextDays();
  card.innerHTML = `
    <p class="step-label">Paso 2 de 4</p>
    <p class="step-question">¿Qué día preferís?</p>
    <div class="day-strip">
      ${days.map((d, i) => `
        <button class="day-btn ${state.dia === i ? 'selected' : ''}" data-i="${i}" data-date="${fmtDate(d)}">
          <span>${dias[d.getDay()]}</span>
          <strong>${d.getDate()}</strong>
          <span>${meses[d.getMonth()]}</span>
        </button>
      `).join("")}
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-back">Volver</button>
      <button class="btn btn-primary" id="btn-next" ${state.dia === null ? "disabled" : ""}>Siguiente</button>
    </div>
  `;
  card.querySelectorAll(".day-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      state.dia = parseInt(btn.dataset.i);
      state._date = days[state.dia];
      render();
    });
  });
  card.querySelector("#btn-back").addEventListener("click", () => { state.step = 0; render(); });
  card.querySelector("#btn-next")?.addEventListener("click", () => { state.step = 2; render(); });
}

function renderHorarios(card) {
  const slots = timeSlots(state._date);
  card.innerHTML = `
    <p class="step-label">Paso 3 de 4</p>
    <p class="step-question">¿A qué hora?</p>
    <div class="time-grid">
      ${slots.map((s, i) => `
        <button class="time-btn ${s.taken ? 'taken' : ''} ${state.hora === i ? 'selected' : ''}"
          data-i="${i}" ${s.taken ? "disabled" : ""}>
          ${s.label}
        </button>
      `).join("")}
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-back">Volver</button>
      <button class="btn btn-primary" id="btn-next" ${state.hora === null ? "disabled" : ""}>Siguiente</button>
    </div>
  `;
  card.querySelectorAll(".time-btn:not(.taken)").forEach(btn => {
    btn.addEventListener("click", () => {
      state.hora = parseInt(btn.dataset.i);
      state._hora = slots[state.hora].label;
      render();
    });
  });
  card.querySelector("#btn-back").addEventListener("click", () => { state.step = 1; render(); });
  card.querySelector("#btn-next")?.addEventListener("click", () => { state.step = 3; render(); });
}

function renderDatos(card) {
  const srv = CONFIG.servicios[state.servicio];
  card.innerHTML = `
    <p class="step-label">Paso 4 de 4</p>
    <p class="step-question">Tus datos para confirmar</p>
    <div class="summary-box">
      <strong>${srv.nombre}</strong><br>
      ${fmtDateHuman(state._date)} · ${state._hora} hs · ${srv.precio}
    </div>
    <div class="field-group">
      <div class="field">
        <label>Tu nombre</label>
        <input type="text" id="inp-nombre" placeholder="Ej: Ana García" value="${state.nombre}" />
      </div>
      <div class="field">
        <label>WhatsApp</label>
        <input type="tel" id="inp-tel" placeholder="Ej: 2235123456" value="${state.tel}" />
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-back">Volver</button>
      <button class="btn btn-primary" id="btn-confirm">Confirmar turno</button>
    </div>
  `;
  card.querySelector("#btn-back").addEventListener("click", () => { state.step = 2; render(); });
  card.querySelector("#btn-confirm").addEventListener("click", () => {
    state.nombre = card.querySelector("#inp-nombre").value.trim();
    state.tel = card.querySelector("#inp-tel").value.trim();
    if (!state.nombre || !state.tel) { alert("Completá tu nombre y WhatsApp para confirmar."); return; }
    const srv = CONFIG.servicios[state.servicio];
    const msg = encodeURIComponent(
      `Hola! Quiero reservar un turno:\n\n` +
      `📋 *${srv.nombre}*\n` +
      `📅 ${fmtDateHuman(state._date)}\n` +
      `🕐 ${state._hora} hs\n` +
      `👤 ${state.nombre}\n` +
      `📱 ${state.tel}\n\n` +
      `¿Está disponible?`
    );
    state.step = 4;
    render();
    setTimeout(() => {
      window.open(`https://wa.me/${CONFIG.whatsapp}?text=${msg}`, "_blank");
    }, 400);
  });
}

function renderConfirm(card) {
  const srv = CONFIG.servicios[state.servicio];
  card.innerHTML = `
    <div style="text-align:center; padding: 12px 0;">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <p style="font-size:20px; font-weight:600; margin-bottom:8px;">¡Turno enviado!</p>
      <p style="font-size:14px; color:var(--muted); margin-bottom:24px;">
        Te mandamos a WhatsApp para confirmar con el negocio.
      </p>
      <div class="summary-box" style="text-align:left">
        <strong>${srv.nombre}</strong><br>
        ${fmtDateHuman(state._date)} · ${state._hora} hs<br>
        ${state.nombre}
      </div>
      <div class="btn-row" style="flex-direction:column;">
        <a class="btn btn-wa" href="https://wa.me/${CONFIG.whatsapp}" target="_blank">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.998 2C6.477 2 2 6.477 2 12c0 1.89.525 3.66 1.438 5.168L2.015 22l4.985-1.31A9.945 9.945 0 0 0 12 22c5.523 0 10-4.477 10-10S17.521 2 11.998 2zm.002 18a7.951 7.951 0 0 1-4.055-1.112l-.291-.173-3.003.787.804-2.924-.19-.299A7.963 7.963 0 0 1 4 12c0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8z"/></svg>
          Abrir WhatsApp
        </a>
        <button class="btn btn-ghost" onclick="state={step:0,servicio:null,dia:null,hora:null,nombre:'',tel:''};render()">
          Sacar otro turno
        </button>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
